name: Quality

on: [pull_request]

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.setupJob.outcome }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - id: setupJob
        run: echo "Setup Complete"

  prettier:
    needs: setup
    runs-on: ubuntu-latest
    if: needs.setup.outputs.status == 'success'

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Prettier check
        run: npx prettier --check src/

  eslint:
    needs: setup
    runs-on: ubuntu-latest
    if: needs.setup.outputs.status == 'success'

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Run ESLint check
        run: npm run lint

  build:
    needs: setup
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build the project
        run: npm run build


